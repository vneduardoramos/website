name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viewnear_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI Postgres (the service above). No pooler in CI, so the direct URL
      # mirrors DATABASE_URL; both are needed because the schema declares
      # url + directUrl.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/viewnear_ci?schema=public"
      DIRECT_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/viewnear_ci?schema=public"
      # Non-default value so the production secret guard passes during `next build`.
      NEXTAUTH_SECRET: "ci-only-build-secret-not-used-at-runtime-9f3a1c"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Build needs a populated DB (pages query it via generateStaticParams).
      - run: npx prisma db push --skip-generate
      - run: npm run db:seed
      - run: npm run build
